name: ptst_app
description: Pandit Todarmal Smarak Trust - Official Mobile App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  dio: ^5.4.0
  google_fonts: ^6.2.0
  flutter_screenutil: ^5.9.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  lottie: ^3.1.0
  smooth_page_indicator: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  local_auth: ^2.2.0
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^18.0.0
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
