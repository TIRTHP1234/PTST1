<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="पंडित टोडरमल स्मारक ट्रस्ट - Pandit Todarmal Smarak Trust">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PTST">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pandit Todarmal Smarak Trust</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FAF6EE;
      color: #7A1228;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.5s ease-out;
    }
    .chakra-ring {
      width: 72px;
      height: 72px;
      border: 3px solid rgba(201, 169, 78, 0.25);
      border-top: 3px solid #C9A94E;
      border-right: 3px solid #F58A1F;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      box-shadow: 0 0 20px rgba(245, 138, 31, 0.2);
      margin-bottom: 24px;
    }
    .title-hi {
      font-size: 20px;
      font-weight: 700;
      color: #7A1228;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .title-en {
      font-size: 13px;
      font-weight: 600;
      color: #8B4513;
      letter-spacing: 1.2px;
      opacity: 0.85;
      text-transform: uppercase;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="chakra-ring"></div>
    <div class="title-hi">पंडित टोडरमल स्मारक ट्रस्ट</div>
    <div class="title-en">Pandit Todarmal Smarak Trust</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
